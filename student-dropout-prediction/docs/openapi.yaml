    RiskFactor:
      type: object
      properties:
        factor:
          type: string
          example: High number of failed curricular units
        tier:
          type: string
          enum: [major, moderate, minor]
          example: major
        direction:
          type: string
          enum: [risk, protective]
          example: risk

    InterventionItem:
      type: object
      properties:
        type:
          type: string
          example: Academic tutoring referral
        date:
          type: string
          format: date
          example: 2026-06-02
        notes:
          type: string
          example: Referred to peer tutoring.
        status:
          type: string
          enum: [Open, "In Progress", Resolved]
          example: In Progress
        mentor_name:
          type: string
          example: Dr. Priya Nair

    # ── Intervention Tracking Schemas
    InterventionStudent:
      allOf:
        - $ref: '#/components/schemas/Student'
        - type: object
          properties:
            intervention_status:
              type: string
              enum: ["Not Started", "In Progress", Resolved, Escalated]
              example: In Progress
            assigned_mentor:
              type: string
              example: Dr. Priya Nair
            last_updated:
              type: string
              format: date
              nullable: true
              example: 2026-07-10
            mentor_notes:
              type: array
              items:
                $ref: '#/components/schemas/InterventionNote'

    InterventionNote:
      type: object
      properties:
        id:
          type: string
          example: n1
        author:
          type: string
          example: Dr. Priya Nair
        timestamp:
          type: string
          format: date-time
          example: 2026-08-17T09:15:00Z
        text:
          type: string
          example: Scheduled follow-up counseling session.

